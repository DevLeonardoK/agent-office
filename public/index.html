<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escritório dos Agentes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070d15'/%3E%3Cg fill='none' stroke='%234d7fa8' stroke-width='2'%3E%3Crect x='5' y='5' width='22' height='22'/%3E%3Cpath d='M5 19h8M19 5v8'/%3E%3C/g%3E%3Ccircle cx='21' cy='21' r='3.5' fill='%23f2b134'/%3E%3C/svg%3E" />
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Desenho frio, gente quente.
   O prédio é uma planta técnica; os agentes são a única coisa saturada.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* ink — tinta de prancheta, com viés azul: cinza puro leria como descuido */
  --ink:        #070d15;
  --plate:      #0b131d;
  --plate-2:    #101a26;
  --rule:       #1a2635;
  --rule-soft:  #131e2b;

  /* o azul técnico só desenha o prédio; nunca vira cor de agente */
  --draft:      #4d7fa8;
  --draft-dim:  rgba(77, 127, 168, .22);
  --draft-grid: rgba(77, 127, 168, .07);

  --text:       #d7e2ee;
  --text-2:     #93a6ba;
  --faint:      #62768c;

  /* semântico, separado da identidade dos agentes */
  --live:       #4ade80;
  --dead:       #46586c;

  /* o arco-íris do agente principal — não é um sexto matiz, é a ausência de
     escolha entre os cinco. Mesmo gradiente na carcaça (SVG #agentRainbow),
     no elenco e no registro. */
  --rainbow: linear-gradient(90deg,
    hsl(0 80% 62%), hsl(32 85% 60%), hsl(52 85% 58%),
    hsl(145 60% 52%), hsl(210 70% 58%), hsl(280 60% 64%));

  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", monospace;
  --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;

  /* escala tipográfica */
  --t-micro: 9.5px;
  --t-note:  10.5px;
  --t-body:  12px;
  --t-lead:  13px;
  --t-head:  15px;

  --rail-l: 200px;
  --rail-r: 312px;
}

* { box-sizing: border-box; margin: 0; }

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font: 400 var(--t-body)/1.55 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── casca ──────────────────────────────────────────────────────────── */

#app {
  height: 100%;
  display: grid;
  /* Trilho recolhido vira uma faixa fina: a planta come o espaço que sobra,
     em vez de ficar espremida entre elenco e registro. */
  grid-template-columns: var(--rail-l) minmax(0, 1fr) var(--rail-r);
  transition: grid-template-columns .28s ease;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    "bar    bar   bar"
    "roster stage feed";
}

#bar {
  grid-area: bar;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 16px;
  height: 46px;
  background: var(--plate);
  border-bottom: 1px solid var(--rule);
}

.brand { display: flex; align-items: center; gap: 9px; }
.brand svg { display: block; }

.brand h1 {
  font: 600 var(--t-lead)/1 var(--sans);
  letter-spacing: .01em;
}

/* etiquetas do desenho: caixa alta, mono, respirando */
.tag {
  font: 500 var(--t-micro)/1 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}

select {
  font: 400 var(--t-note)/1 var(--mono);
  color: var(--text-2);
  background: var(--plate-2);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 6px 8px;
  max-width: 330px;
}

select:focus-visible, input:focus-visible {
  outline: 2px solid var(--draft);
  outline-offset: 1px;
}

#followLbl {
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; user-select: none;
  font: 400 var(--t-note)/1 var(--mono);
  color: var(--faint);
  white-space: nowrap;
}

#followLbl input { accent-color: var(--draft); cursor: pointer; }

#status {
  margin-left: auto;
  display: flex; align-items: center; gap: 7px;
  font: 400 var(--t-note)/1 var(--mono);
  color: var(--faint);
  letter-spacing: .06em;
}

#dot {
  width: 6px; height: 6px;
  background: var(--dead);
  transition: background .4s, box-shadow .4s;
}

#dot.live { background: var(--live); box-shadow: 0 0 0 3px rgb(74 222 128 / .14); }

/* ── trilhos ────────────────────────────────────────────────────────── */

#roster, #feed {
  background: var(--plate);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

#roster { grid-area: roster; border-right: 1px solid var(--rule); }
#feed   { grid-area: feed;   border-left:  1px solid var(--rule); }

#app[data-roster="off"] { --rail-l: 34px; }
#app[data-feed="off"]   { --rail-r: 34px; }

/* Recolhido, sobra a lombada: o título de pé e o botão de reabrir. */
#app[data-roster="off"] #roster .rail-body,
#app[data-feed="off"]   #feed   .rail-body { display: none; }
#app[data-roster="off"] #roster .rail-head,
#app[data-feed="off"]   #feed   .rail-head {
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 4px;
  border-bottom: none;
}
#app[data-roster="off"] #roster .rail-head > .tag,
#app[data-feed="off"]   #feed   .rail-head > .tag {
  writing-mode: vertical-rl;
  letter-spacing: .18em;
}
#app[data-roster="off"] #roster .rail-head-end,
#app[data-feed="off"]   #feed   .rail-head-end { flex-direction: column-reverse; }
#app[data-roster="off"] #rosterToggle,
#app[data-feed="off"]   #feedToggle { transform: rotate(180deg); }

.rail-head-end { display: flex; align-items: center; gap: 6px; }

.rail-toggle {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  padding: 0;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--faint);
  font: 12px/1 var(--mono);
  cursor: pointer;
}
.rail-toggle:hover { color: var(--text); border-color: var(--draft); }

.rail-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 11px 13px 9px;
  border-bottom: 1px solid var(--rule-soft);
}

.rail-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.rail-body::-webkit-scrollbar { width: 8px; }
.rail-body::-webkit-scrollbar-thumb { background: var(--rule); }

/* ── elenco (o resumo, antes do detalhe) ────────────────────────────── */

.cast-row {
  display: grid;
  grid-template-columns: 9px 1fr;
  gap: 9px;
  align-items: start;
  padding: 9px 13px;
  border-bottom: 1px solid var(--rule-soft);
}

/* estado codificado na forma, não só na cor: cheio = trabalhando */
.chip {
  width: 9px; height: 9px;
  margin-top: 3px;
  border: 1.5px solid hsl(var(--h) 72% 60%);
  background: transparent;
}

.cast-row[data-status="working"] .chip {
  background: hsl(var(--h) 72% 60%);
  animation: pulse 1.5s ease-in-out infinite;
}

.cast-row[data-status="leaving"] { opacity: .45; }

@keyframes pulse { 50% { opacity: .35; } }

.cast-name {
  font: 500 var(--t-body)/1.3 var(--mono);
  color: hsl(var(--h) 62% 74%);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.cast-doing {
  font: 400 var(--t-micro)/1.45 var(--mono);
  color: var(--faint);
  letter-spacing: .04em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.cast-doing b { color: var(--text-2); font-weight: 500; }

/* o principal carrega o arco-íris, não uma matiz — igual à carcaça do robô */
.cast-row[data-main] .cast-name, .log-row[data-main] .log-who {
  background: var(--rainbow);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.cast-row[data-main] .chip { border-color: transparent; background: var(--rainbow); opacity: .5; }
.cast-row[data-main][data-status="working"] .chip { opacity: 1; }

/* ── registro ───────────────────────────────────────────────────────── */

.log-row {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 9px;
  padding: 6px 13px;
  font: 400 var(--t-note)/1.5 var(--mono);
  border-bottom: 1px solid var(--rule-soft);
}

.log-at {
  color: #3f5064;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

.log-who { color: hsl(var(--h) 62% 70%); }
.log-what { color: var(--text-2); word-break: break-word; }
.log-what .verb { color: var(--faint); }
.log-row[data-tone="speech"] .log-what { color: var(--text); }

/* ── palco ──────────────────────────────────────────────────────────── */

#stage {
  grid-area: stage;
  position: relative;
  min-width: 0;
  /* o prédio alto sobe além da caixa do #plan: o palco é quem recorta */
  overflow: hidden;
  display: grid;
  place-items: center;
  /* grade da prancheta */
  background:
    repeating-linear-gradient(0deg, var(--draft-grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--draft-grid) 0 1px, transparent 1px 40px),
    radial-gradient(120% 90% at 50% 0%, #0c1622 0%, var(--ink) 72%);
}

#plan {
  position: relative;
  width: 1000px;
  height: 620px;
  flex: none;
  transform-origin: center;
}

/* A caixa do #plan é o 1º andar mais o térreo; a planta desenhada sobe acima
   dela conforme o prédio cresce, então top/height vêm do JS. */
#blueprint { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

#props, #agents, #doors, #floors { position: absolute; inset: 0; }

/* ── vistas: corte vertical e andar cheio (issue #11) ────────────────────── */

#floors { pointer-events: none; }

.floor-hit {
  position: absolute;
  padding: 0;
  background: none;
  border: 1px dashed transparent;
  border-radius: 3px;
  cursor: pointer;
  pointer-events: auto;
  transition: background-color .18s, border-color .18s;
}
/* No andar cheio, o resto do prédio some sob um véu: a moldura do andar aberto
   projeta uma sombra que cobre tudo o que está fora dela. */
#stage[data-view="floor"] .floor-hit {
  border-color: hsl(205 55% 60% / .45);
  box-shadow: 0 0 0 9999px hsl(215 45% 4% / .82);
}

.floor-hit:hover, .floor-hit:focus-visible {
  background: hsl(205 60% 60% / .05);
  border-color: hsl(205 55% 60% / .38);
  outline: none;
}

#viewBack {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--text-2);
  font: 500 var(--t-micro)/1 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
}
#viewBack[hidden] { display: none; }   /* display:flex venceria o atributo hidden */
#viewBack:hover { color: var(--text); border-color: var(--draft); }
#viewBack kbd { font: inherit; color: var(--faint); }

/* ── plaquetas da porta (o agent_type do ocupante do cômodo) ─────────────── */

.door-plate {
  position: absolute;
  transform: translate(-50%, -50%);
  max-width: 168px;
  padding: 3px 8px;
  background: var(--ink);
  border: 1px solid hsl(var(--h) 45% 46%);
  border-radius: 2px;
  font: 500 var(--t-micro)/1.2 var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: hsl(var(--h) 55% 74%);
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}

.door-plate[data-main] { border-color: #c9c0a8; color: #e4dcc6; }
.door-plate[data-leaving] { opacity: .4; }
.door-plate[data-away] { border-style: dashed; opacity: .7; }

/* marca "ocupado, fora": o dono desceu ao térreo usar uma estação (issue #9) */
.room-mark {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 2px 7px;
  border: 1px dashed hsl(var(--h) 45% 50%);
  border-radius: 2px;
  font: 500 var(--t-micro)/1.2 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: hsl(var(--h) 50% 66%);
  opacity: .62;
  white-space: nowrap;
  pointer-events: none;
}
.room-mark[data-main] { border-color: #b5ad98; color: #cfc7b2; }

/* ── móveis, como símbolo de planta ─────────────────────────────────── */

.prop {
  position: absolute;
  top: 0; left: 0;
  width: 104px;
  margin: -34px 0 0 -52px;   /* ancora no centro do símbolo */
  text-align: center;
  will-change: transform, opacity;
}

.prop svg { display: block; margin: 0 auto; overflow: visible; }
.prop .sym { stroke: var(--draft); fill: none; stroke-width: 1.4; transition: stroke .5s, filter .5s; }
.prop .sym-fill { fill: rgb(77 127 168 / .07); stroke: none; transition: fill .5s; }

.prop-label {
  display: block;
  margin-top: 5px;
  font: 400 var(--t-micro)/1.25 var(--mono);
  letter-spacing: .05em;
  color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .5s;
}

.prop.hit .sym { stroke: #9ec9e8; filter: drop-shadow(0 0 6px rgb(120 190 235 / .55)); }
.prop.hit .sym-fill { fill: rgb(120 190 235 / .13); }
.prop.hit .prop-label { color: var(--text-2); }

/* ── agentes ────────────────────────────────────────────────────────── */

.agent {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  will-change: transform;
}

.agent .figure { position: absolute; left: -29px; top: -64px; width: 58px; height: 71px; }
.agent .figure svg { display: block; overflow: visible; }

.agent .flip { transform-origin: 23px 50px; transition: transform .18s ease; }
.agent .figure svg { width: 58px; height: 71px; }
.agent[data-face="-1"] .flip { transform: scaleX(-1); }

/* a carcaça é o matiz: metal pintado, com a face de trás mais escura */
.agent .chassis       { fill: hsl(var(--h) 62% 52%); stroke: hsl(var(--h) 55% 32%); stroke-width: 1.2; }
.agent .chassis-shade { fill: hsl(var(--h) 55% 30%); }
.agent .panel         { stroke: hsl(var(--h) 45% 26%); stroke-width: .9; fill: none; }
.agent .vent          { stroke: hsl(var(--h) 45% 30%); stroke-width: 1; opacity: .8; }
.agent .screws circle { fill: hsl(var(--h) 40% 26%); }
.agent .handle        { stroke: hsl(var(--h) 55% 40%); stroke-width: 2.4; fill: none; stroke-linecap: round; }

/* plaqueta gravada na carcaça, como o SUBAGENT 01 das fotos de referência */
.agent .badge      { fill: hsl(var(--h) 30% 26%); stroke: hsl(var(--h) 40% 36%); stroke-width: .7; }
.agent .badge-etch { stroke: hsl(var(--h) 60% 72%); stroke-width: 1.2; stroke-linecap: round; }

/* esteiras: correia escura, dentes e as quatro roldanas */
.agent .belt        { fill: hsl(215 18% 13%); stroke: hsl(215 14% 26%); stroke-width: 1; }
.agent .tread-teeth { stroke: hsl(215 12% 30%); stroke-width: 1.1; opacity: .8; }
.agent .roller      { fill: hsl(215 14% 22%); stroke: hsl(215 12% 34%); stroke-width: .9; }
.agent .axle        { stroke: hsl(var(--h) 45% 34%); stroke-width: 3; stroke-linecap: round; }
.agent .drop        { fill: #000; opacity: .42; }

/* a tela-rosto domina a face: vidro fundo, moldura, e o brilho do matiz */
.agent .bezel  { fill: hsl(var(--h) 50% 24%); stroke: hsl(var(--h) 45% 20%); stroke-width: 1; }
.agent .screen { fill: #060c14; stroke: hsl(var(--h) 40% 18%); stroke-width: 1; }

.agent .eye    { fill: hsl(var(--h) 92% 76%); }
.agent .mouth  { stroke: hsl(var(--h) 92% 76%); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.agent .eye-line, .agent .eye-x { stroke: hsl(var(--h) 92% 76%); stroke-width: 2.1; stroke-linecap: round; fill: none; }
.agent .eye-x  { stroke: #ff6b6b; }

/* três estados de rosto; só um aparece por vez */
.agent .m { display: none; }
.agent[data-mood="idle"]  .m-idle  { display: block; }
.agent[data-mood="work"]  .m-work  { display: block; }
.agent[data-mood="error"] .m-error { display: block; }

/* olhar na direção do móvel: trabalhando, os olhos deslizam para a frente.
   Não é animação cíclica — assenta num estado fixo, íntegro no print. */
.agent .face { transition: transform .2s ease; }
.agent.working .face { transform: translateX(1.6px); }

/* a tela acesa é o único brilho do robô, e só enquanto ele trabalha */
.agent.working .screen { fill: hsl(var(--h) 45% 12%); }

/* o principal carrega o arco-íris na carcaça, não uma matiz */
.agent[data-main] .chassis { fill: url(#agentRainbow); stroke: hsl(0 0% 100% / .35); }
.agent[data-main] .chassis-shade { fill: #000; opacity: .16; }
.agent[data-main] .eye     { fill: #fff; }
.agent[data-main] .mouth   { stroke: #fff; }
.agent[data-main] .eye-line { stroke: #fff; }
.agent[data-main] .badge-etch { stroke: #fff; }

/* plaqueta de identificação, na carcaça: o agent_type, legível de longe */
.agent .plate {
  position: absolute;
  left: 4px; top: 73px; width: 50px; height: 11px;
  display: flex; align-items: center; justify-content: center;
  background: #0a1420;
  border: 1px solid hsl(var(--h) 45% 42%);
  border-radius: 2px;
  overflow: hidden;
  pointer-events: none;
}

.agent .plate-type {
  max-width: 100%;
  font: 600 6.5px/1 var(--mono);
  letter-spacing: .02em;
  text-transform: uppercase;
  color: hsl(var(--h) 65% 80%);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.agent[data-main] .plate { border-color: hsl(0 0% 100% / .5); }
.agent[data-main] .plate-type {
  background: var(--rainbow);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.agent-name {
  position: absolute;
  left: -60px; top: 30px;
  width: 120px;
  text-align: center;
  font: 500 var(--t-micro)/1.2 var(--mono);
  letter-spacing: .09em;
  text-transform: uppercase;
  pointer-events: none;
}

.agent-tool {
  display: block;
  font-size: 8.5px;
  letter-spacing: .12em;
  color: var(--faint);
  min-height: 10px;
}

/* Nenhuma animação cíclica no robô: esteira é desenho, não movimento. A única
   motricidade é o deslocamento x/y, que passa pela motion.dev — nada que
   congele torto no print. */

/* dentro da cabine o robô não "caminha": ele é levado */
.agent.riding .flip { transform: none; }

/* ── fala ───────────────────────────────────────────────────────────── */

.bubble {
  position: absolute;
  bottom: calc(62px + var(--lift, 0px));
  left: 50%;
  width: max-content;
  max-width: 236px;
  padding: 7px 10px 8px;
  transform: translateX(-50%);
  background: #0a1420;
  border: 1px solid hsl(var(--h) 45% 38%);
  border-left-width: 2px;
  font: 400 var(--t-note)/1.5 var(--mono);
  color: var(--text);
  text-align: left;
  z-index: 20;
  pointer-events: none;
  box-shadow: 0 10px 26px rgb(0 0 0 / .6);
}

.bubble[data-anchor="left"] { left: -14px; transform: none; }
.bubble[data-anchor="left"]::after { left: 22px; }

.bubble::after {
  content: "";
  position: absolute;
  left: 14px; bottom: -5px;
  width: 8px; height: 8px;
  background: #0a1420;
  border-right: 1px solid hsl(var(--h) 45% 38%);
  border-bottom: 1px solid hsl(var(--h) 45% 38%);
  transform: rotate(45deg);
}

.bubble[data-tone="order"]  { border-color: var(--draft); }
.bubble[data-tone="order"]::after { border-color: var(--draft); }
.bubble[data-tone="result"] { border-color: hsl(var(--h) 50% 46%); }
.bubble[data-tone="brief"]  { color: var(--text-2); }

/* ── vazio ──────────────────────────────────────────────────────────── */

#empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 10px;
  text-align: center;
  pointer-events: none;
  transition: opacity .5s;
}

#empty[hidden] { display: none; }

#empty p {
  font: 400 var(--t-note)/1.7 var(--mono);
  letter-spacing: .05em;
  color: var(--faint);
  max-width: 34ch;
}

#empty .tag { font-size: var(--t-body); letter-spacing: .3em; color: var(--text-2); }

/* ── telas estreitas ────────────────────────────────────────────────── */

@media (max-width: 1180px) {
  #app { grid-template-columns: minmax(0, 1fr) var(--rail-r); grid-template-areas: "bar bar" "stage feed"; }
  #roster { display: none; }
}

@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "stage"; }
  #feed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">

  <header id="bar">
    <div class="brand">
      <svg width="17" height="17" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="4" width="24" height="24" fill="none" stroke="#4d7fa8" stroke-width="2" />
        <path d="M4 20h9M20 4v9" stroke="#4d7fa8" stroke-width="2" />
        <circle cx="21.5" cy="21.5" r="3.5" fill="#f2b134" />
      </svg>
      <h1>Escritório dos Agentes</h1>
    </div>

    <select id="rooms" aria-label="Sessão em exibição">
      <option>sem sessões</option>
    </select>

    <label id="followLbl">
      <input type="checkbox" id="follow" checked />
      seguir a ativa
    </label>

    <div id="status"><i id="dot"></i><span id="statusText">conectando</span></div>
  </header>

  <aside id="roster">
    <div class="rail-head">
      <span class="tag">no prédio</span>
      <span class="rail-head-end">
        <span class="tag" id="castCount">0</span>
        <button type="button" class="rail-toggle" id="rosterToggle" title="recolher o elenco">‹</button>
      </span>
    </div>
    <div class="rail-body" id="castList"></div>
  </aside>

  <main id="stage">
    <div id="plan">
      <svg id="blueprint" viewBox="0 0 1000 620" aria-hidden="true"></svg>
      <div id="doors"></div>
      <div id="props"></div>
      <div id="agents"></div>
      <div id="floors"></div>
    </div>

    <button type="button" id="viewBack" hidden>voltar à vista empilhada <kbd>esc</kbd></button>

    <div id="empty">
      <span class="tag">prédio vazio</span>
      <p>Peça alguma coisa ao Claude Code. Cada agente vivo ganha um cômodo no 1º andar.</p>
    </div>
  </main>

  <aside id="feed">
    <div class="rail-head">
      <span class="tag">registro</span>
      <span class="rail-head-end">
        <span class="tag" id="logCount"></span>
        <button type="button" class="rail-toggle" id="feedToggle" title="recolher o registro">›</button>
      </span>
    </div>
    <div class="rail-body" id="logList"></div>
  </aside>

</div>
<script type="module" src="/office.js"></script>
</body>
</html>
