<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escritório dos Agentes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070d15'/%3E%3Cg fill='none' stroke='%234d7fa8' stroke-width='2'%3E%3Crect x='5' y='5' width='22' height='22'/%3E%3Cpath d='M5 19h8M19 5v8'/%3E%3C/g%3E%3Ccircle cx='21' cy='21' r='3.5' fill='%23f2b134'/%3E%3C/svg%3E" />
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Desenho frio, gente quente.
   O prédio é uma planta técnica; os agentes são a única coisa saturada.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* ink — tinta de prancheta, com viés azul: cinza puro leria como descuido */
  --ink:        #070d15;
  --plate:      #0b131d;
  --plate-2:    #101a26;
  --rule:       #1a2635;
  --rule-soft:  #131e2b;

  /* o azul técnico só desenha o prédio; nunca vira cor de agente */
  --draft:      #4d7fa8;
  --draft-dim:  rgba(77, 127, 168, .22);
  --draft-grid: rgba(77, 127, 168, .07);

  --text:       #d7e2ee;
  --text-2:     #93a6ba;
  --faint:      #62768c;

  /* semântico, separado da identidade dos agentes */
  --live:       #4ade80;
  --dead:       #46586c;

  /* o arco-íris do agente principal — não é um sexto matiz, é a ausência de
     escolha entre os seis matizes da paleta. Mesmo gradiente na carcaça,
     no elenco e no registro. */
  --rainbow: linear-gradient(90deg,
    hsl(0 80% 62%), hsl(32 85% 60%), hsl(52 85% 58%),
    hsl(145 60% 52%), hsl(210 70% 58%), hsl(280 60% 64%));

  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", monospace;
  --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;

  /* escala tipográfica */
  --t-micro: 9.5px;
  --t-note:  10.5px;
  --t-body:  12px;
  --t-lead:  13px;
  --t-head:  15px;

  --floor: #0d1a28;
  --wall: #0b1622;
  --wall-2: #091220;
  --slab: #0a1420;
  --slab-2: #070f19;
  --rail-l: 200px;
  --rail-r: 312px;
}

* { box-sizing: border-box; margin: 0; }

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font: 400 var(--t-body)/1.55 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── casca ──────────────────────────────────────────────────────────── */

#app {
  height: 100%;
  position: relative;   /* âncora dos trilhos flutuantes */
  display: grid;
  /* Uma coluna só: os trilhos flutuam por cima do palco, em vez de disputarem
     largura com ele. Antes, elenco e registro abertos comiam 512px e a planta
     encolhia até caber no que sobrava. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    "bar"
    "stage";
}

#bar {
  grid-area: bar;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 16px;
  height: 46px;
  background: var(--plate);
  border-bottom: 1px solid var(--rule);
}

.brand { display: flex; align-items: center; gap: 9px; }
.brand svg { display: block; }

.brand h1 {
  font: 600 var(--t-lead)/1 var(--sans);
  letter-spacing: .01em;
}

/* etiquetas do desenho: caixa alta, mono, respirando */
.tag {
  font: 500 var(--t-micro)/1 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}

select {
  font: 400 var(--t-note)/1 var(--mono);
  color: var(--text-2);
  background: var(--plate-2);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 6px 8px;
  max-width: 330px;
}

select:focus-visible, input:focus-visible {
  outline: 2px solid var(--draft);
  outline-offset: 1px;
}

#followLbl {
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; user-select: none;
  font: 400 var(--t-note)/1 var(--mono);
  color: var(--faint);
  white-space: nowrap;
}

#followLbl input { accent-color: var(--draft); cursor: pointer; }

#status {
  margin-left: auto;
  display: flex; align-items: center; gap: 7px;
  font: 400 var(--t-note)/1 var(--mono);
  color: var(--faint);
  letter-spacing: .06em;
}

#dot {
  width: 6px; height: 6px;
  background: var(--dead);
  transition: background .4s, box-shadow .4s;
}

#dot.live { background: var(--live); box-shadow: 0 0 0 3px rgb(74 222 128 / .14); }

/* ── trilhos ────────────────────────────────────────────────────────── */

#roster, #feed {
  background: var(--plate);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* Painéis flutuantes: encostados nas bordas do palco, translúcidos, com a
   planta correndo por baixo. */
#roster, #feed {
  position: absolute;
  top: 0; bottom: 0;
  z-index: 60;
  /* Sem backdrop-filter: além de custar composição por quadro, ele quebra a
     pintura do conteúdo no headless — o registro saía vazio no print. */
  background: color-mix(in srgb, var(--plate) 94%, transparent);
  transition: width .26s ease;
}
#roster { grid-area: stage; left: 0;  width: var(--rail-l); border-right: 1px solid var(--rule); }
#feed   { grid-area: stage; right: 0; width: var(--rail-r); border-left:  1px solid var(--rule); }

#app[data-roster="off"] { --rail-l: 36px; }
#app[data-feed="off"]   { --rail-r: 36px; }

/* Recolhido, sobra a lombada: o título de pé e o botão de reabrir. */
#app[data-roster="off"] #roster .rail-body,
#app[data-feed="off"]   #feed   .rail-body { display: none; }
#app[data-roster="off"] #roster .rail-head,
#app[data-feed="off"]   #feed   .rail-head {
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 4px;
  border-bottom: none;
}
#app[data-roster="off"] #roster .rail-head > .tag,
#app[data-feed="off"]   #feed   .rail-head > .tag {
  writing-mode: vertical-rl;
  letter-spacing: .18em;
}
#app[data-roster="off"] #roster .rail-head-end,
#app[data-feed="off"]   #feed   .rail-head-end { flex-direction: column-reverse; }
#app[data-roster="off"] #rosterToggle,
#app[data-feed="off"]   #feedToggle { transform: rotate(180deg); }

.rail-head-end { display: flex; align-items: center; gap: 6px; }

.rail-toggle {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  padding: 0;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--faint);
  font: 12px/1 var(--mono);
  cursor: pointer;
}
.rail-toggle:hover { color: var(--text); border-color: var(--draft); }

.rail-head {
  position: relative;
  z-index: 1;
  background: var(--plate);
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 11px 13px 9px;
  border-bottom: 1px solid var(--rule-soft);
}

.rail-body {
  position: absolute;
  top: 37px; left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.rail-body::-webkit-scrollbar { width: 8px; }
.rail-body::-webkit-scrollbar-thumb { background: var(--rule); }

/* ── elenco (o resumo, antes do detalhe) ────────────────────────────── */

.cast-row {
  display: grid;
  grid-template-columns: 9px 1fr;
  gap: 9px;
  align-items: start;
  padding: 9px 13px;
  border-bottom: 1px solid var(--rule-soft);
}

/* estado codificado na forma, não só na cor: cheio = trabalhando */
.chip {
  width: 9px; height: 9px;
  margin-top: 3px;
  border: 1.5px solid hsl(var(--h) 72% 60%);
  background: transparent;
}

.cast-row[data-status="working"] .chip {
  background: hsl(var(--h) 72% 60%);
  animation: pulse 1.5s ease-in-out infinite;
}

.cast-row[data-status="leaving"] { opacity: .45; }

@keyframes pulse { 50% { opacity: .35; } }

.cast-name {
  font: 500 var(--t-body)/1.3 var(--mono);
  color: hsl(var(--h) 62% 74%);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.cast-doing {
  font: 400 var(--t-micro)/1.45 var(--mono);
  color: var(--faint);
  letter-spacing: .04em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.cast-doing b { color: var(--text-2); font-weight: 500; }

/* o principal carrega o arco-íris, não uma matiz — igual à carcaça do robô */
.cast-row[data-main] .cast-name, .log-row[data-main] .log-who {
  background: var(--rainbow);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.cast-row[data-main] .chip { border-color: transparent; background: var(--rainbow); opacity: .5; }
.cast-row[data-main][data-status="working"] .chip { opacity: 1; }

/* ── registro ───────────────────────────────────────────────────────── */

.log-row {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 9px;
  padding: 6px 13px;
  font: 400 var(--t-note)/1.5 var(--mono);
  border-bottom: 1px solid var(--rule-soft);
}

.log-at {
  color: #3f5064;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

.log-who { color: hsl(var(--h) 62% 70%); }
.log-what { color: var(--text-2); word-break: break-word; }
.log-what .verb { color: var(--faint); }
.log-row[data-tone="speech"] .log-what { color: var(--text); }

/* ── palco ──────────────────────────────────────────────────────────── */

/* Carimbo de versão: existe para responder "o navegador está com o desenho
   novo?" sem abrir o inspetor. Cache velho mostra outra coisa aqui. */
#build {
  margin-left: auto;
  padding: 2px 7px;
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--faint);
  font: 500 var(--t-micro)/1.3 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
}

#stage {
  grid-area: stage;
  position: relative;
  min-width: 0;
  /* o prédio alto sobe além da caixa do #plan: o palco é quem recorta */
  overflow: hidden;
  display: grid;
  place-items: center;
  /* grade da prancheta */
  background:
    repeating-linear-gradient(0deg, var(--draft-grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--draft-grid) 0 1px, transparent 1px 40px),
    radial-gradient(120% 90% at 50% 0%, #0c1622 0%, var(--ink) 72%);
}

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Rótulos: DOM sobre a cena 3D, reposicionados por quadro a partir do ponto de
   mundo. Texto continua sendo texto — nítido em qualquer zoom. */
#overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.tag3d {
  position: absolute;
  top: 0; left: 0;
  white-space: nowrap;
  will-change: transform;
}

.tag3d.station {
  padding: 2px 6px;
  color: var(--faint);
  font: 500 var(--t-micro)/1.2 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
}

.tag3d.prop {
  padding: 2px 6px;
  background: color-mix(in srgb, var(--ink) 80%, transparent);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--text-2);
  font: 400 var(--t-micro)/1.2 var(--mono);
}

.tag3d.plate {
  padding: 3px 8px;
  background: var(--ink);
  border: 1px solid hsl(var(--h) 45% 46%);
  border-radius: 2px;
  color: hsl(var(--h) 55% 74%);
  font: 500 var(--t-micro)/1.2 var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  max-width: 168px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tag3d.plate[data-main] {
  border-image: linear-gradient(90deg, hsl(0 80% 62%), hsl(52 85% 58%), hsl(145 60% 52%), hsl(210 70% 58%), hsl(280 60% 64%)) 1;
  color: var(--text);
}
.tag3d.plate[data-away] { opacity: .55; border-style: dashed; }

.tag3d.bubble {
  max-width: 260px;
  padding: 7px 10px;
  background: var(--plate);
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--text);
  font: 400 var(--t-body)/1.4 var(--sans);
  white-space: normal;
  box-shadow: 0 8px 24px rgb(0 0 0 / .45);
}
.tag3d.bubble[data-tone="order"] { border-color: hsl(210 60% 50% / .6); }
.tag3d.bubble[data-tone="result"] { border-color: hsl(150 45% 45% / .6); }

/* ── vazio ──────────────────────────────────────────────────────────── */

#empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 10px;
  text-align: center;
  pointer-events: none;
  transition: opacity .5s;
}

#empty[hidden] { display: none; }

#empty p {
  font: 400 var(--t-note)/1.7 var(--mono);
  letter-spacing: .05em;
  color: var(--faint);
  max-width: 34ch;
}

#empty .tag { font-size: var(--t-body); letter-spacing: .3em; color: var(--text-2); }

/* ── telas estreitas ────────────────────────────────────────────────── */

@media (max-width: 1180px) {
  #app { grid-template-columns: minmax(0, 1fr) var(--rail-r); grid-template-areas: "bar bar" "stage feed"; }
  #roster { display: none; }
}

@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "stage"; }
  #feed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">

  <header id="bar">
    <div class="brand">
      <svg width="17" height="17" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="4" width="24" height="24" fill="none" stroke="#4d7fa8" stroke-width="2" />
        <path d="M4 20h9M20 4v9" stroke="#4d7fa8" stroke-width="2" />
        <circle cx="21.5" cy="21.5" r="3.5" fill="#f2b134" />
      </svg>
      <h1>Escritório dos Agentes</h1>
    </div>

    <select id="rooms" aria-label="Sessão em exibição">
      <option>sem sessões</option>
    </select>

    <label id="followLbl">
      <input type="checkbox" id="follow" checked />
      seguir a ativa
    </label>

    <span id="build" title="versão do desenho carregada no navegador">—</span>
    <div id="status"><i id="dot"></i><span id="statusText">conectando</span></div>
  </header>

  <aside id="roster">
    <div class="rail-head">
      <span class="tag">no prédio</span>
      <span class="rail-head-end">
        <span class="tag" id="castCount">0</span>
        <button type="button" class="rail-toggle" id="rosterToggle" title="recolher o elenco">‹</button>
      </span>
    </div>
    <div class="rail-body" id="castList"></div>
  </aside>

  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="overlay" aria-live="off"></div>


    <div id="empty">
      <span class="tag">prédio vazio</span>
      <p>Peça alguma coisa ao Claude Code. Cada agente vivo ganha um cômodo no 1º andar.</p>
    </div>
  </main>

  <aside id="feed">
    <div class="rail-head">
      <span class="tag">registro</span>
      <span class="rail-head-end">
        <span class="tag" id="logCount"></span>
        <button type="button" class="rail-toggle" id="feedToggle" title="recolher o registro">›</button>
      </span>
    </div>
    <div class="rail-body" id="logList"></div>
  </aside>

</div>
<script type="module" src="/office.js"></script>
</body>
</html>
